[target.apex_p]
runner = "speculos -m apex_p"

[build]
target = "apex_p"

[profile.release]
opt-level = 'z'
lto = true

# Uncomment the line below to generate a map file
# rustflags = ["-Clink-args=-Map=app.map"]

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

# Authorized values are [2048, 4096, 8192, 16384, 24576]. The largest review
# (MAX_REVIEW_BYTES in src/tx/mod.rs) is held twice while NBGL shows it.
[env]
HEAP_SIZE = "16384"