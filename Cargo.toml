[package]
name = "app-gno"
version = "0.1.0"
authors = ["Gno contributors"]
description = "Ledger device application for gno.land"
license = "Apache-2.0"
repository = "https://github.com/gnolang/ledger-app-gno"
edition = "2021"

[dependencies]
ledger_device_sdk = {version = "*", features = ["io_new", "sys"]}

[build-dependencies]
# Decode the source GIFs and write the processed grayscale PNG glyph without
# pulling the full `image` crate (and its color-management stack). The luma
# conversion in build.rs reproduces `image::into_luma8()`.
gif = "0.14"
png = "0.18"

[features]
default = ["ledger_device_sdk/nano_nbgl"]
debug = ["ledger_device_sdk/debug"]

[package.metadata.ledger]
curve = ["secp256k1"]
flags = "0"
path = ["44'/118'"]
name = "Gno.land"
nanosplus = { icon = "icons/gno_14x14.gif" }
nanox = { icon = "icons/gno_14x14.gif" }
stax = { icon = "icons/gno_32x32.gif" }
flex = { icon = "icons/gno_40x40.gif" }
apex_p = { icon = "icons/gno_32x32.png" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("apex_p", "stax", "flex", "nanos", "nanox", "nanosplus"))'] }
