name: ClusterFuzzLite fuzzing tests

# Fuzzes the sign-doc parser, the DER signature conversion and the package
# source scanner (fuzz/). Mirrors Ledger's reusable_clusterfuzz_tests.yml, which
# is built for C apps (language: c, MemorySanitizer), with Rust settings:
# cargo-fuzz targets under AddressSanitizer.
#   - pull requests: fuzz the change for 5 minutes;
#   - pushes: batch fuzzing for 10 minutes, growing the corpus;
#   - weekly and on demand: batch fuzzing for 5 hours, then corpus pruning.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - develop
  schedule:
    - cron: '0 13 * * 6'

permissions:
  contents: read

jobs:
  fuzzing:
    name: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }} (address)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: rust
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: rust
          sanitizer: address
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || (github.event_name == 'push' && 600 || 18000) }}

  prune:
    name: prune (address)
    runs-on: ubuntu-latest
    needs: fuzzing
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: rust
          sanitizer: address

      - name: Prune corpus
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: rust
          sanitizer: address
          mode: prune
          fuzz-seconds: 1800
