name: GitHub release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # A release is cut only from a commit whose tests pass in this very run,
  # since the build takes the latest ledger_device_sdk.
  functional-tests:
    name: Build and functional tests
    uses: ./.github/workflows/build_and_functional_tests.yml
    permissions:
      contents: write
      actions: write
      pull-requests: write

  host-tests:
    name: Host-side parser tests
    uses: ./.github/workflows/host_tests.yml

  github-release:
    name: GitHub release using the reusable workflow
    needs: [functional-tests, host-tests]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_app_release.yml@v1
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write
      pull-requests: write
    with:
      app_ref_name: ${{ github.ref_name }}
      builder: 'ledger-app-builder'

  sideload-installer:
    name: Attach the sideload installers to the release
    needs: github-release
    uses: ./.github/workflows/sideload_installer.yml
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      # Checked statically for the nested reusable_build.yml call, even though it is skipped here.
      pull-requests: write
    with:
      # Package the exact binaries published by github-release rather than rebuilding them.
      binaries_artifact: app_binaries
      release_tag: ${{ github.ref_name }}
